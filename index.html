<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafetera Retro Interactiva</title>
  <style>
    :root {
      --bg-color: #f0d2b3;
      --panel-color: #f8e4ce;
      --accent-color: #7a4b35;
      --coffee-color: rgba(103, 53, 32, 0.85);
      --milk-color: rgba(254, 244, 229, 0.65);
      --glass-stroke: rgba(255, 255, 255, 0.45);
      --slider-track: #c78d6a;
      --slider-thumb: #7a4b35;
      --font: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      color: var(--accent-color);
      font-family: var(--font);
      letter-spacing: 0.04em;
    }

    .machine {
      background: var(--panel-color);
      border: 4px solid var(--accent-color);
      border-radius: 24px;
      padding: 32px;
      width: min(92vw, 640px);
      box-shadow: 0 16px 0 rgba(122, 75, 53, 0.2);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      text-transform: uppercase;
    }

    .controls {
      display: grid;
      gap: 20px;
      margin-block: 24px;
    }

    label {
      font-size: 0.95rem;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 12px;
      background: var(--slider-track);
      border-radius: 999px;
      border: 2px solid var(--accent-color);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      background: var(--slider-thumb);
      border-radius: 50%;
      border: 3px solid var(--panel-color);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    }

    input[type="range"]::-moz-range-thumb {
      width: 26px;
      height: 26px;
      background: var(--slider-thumb);
      border-radius: 50%;
      border: 3px solid var(--panel-color);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    button {
      flex: 1 1 160px;
      padding: 12px 18px;
      border: 3px solid var(--accent-color);
      background: var(--bg-color);
      color: var(--accent-color);
      font-family: var(--font);
      font-size: 0.95rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.15);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.1);
    }

    .display {
      position: relative;
      height: 280px;
      margin-inline: auto;
      width: 220px;
      border: 5px solid var(--glass-stroke);
      border-radius: 24px 24px 32px 32px;
      padding: 16px;
      background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.3), transparent 55%);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.15);
    }

    .cup {
      position: relative;
      width: 100%;
      height: 100%;
      border: 4px solid rgba(255, 255, 255, 0.35);
      border-bottom-width: 8px;
      border-radius: 24px 24px 20px 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(1px);
    }

    .cup::before,
    .cup::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .cup::before {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, transparent 45%);
      mix-blend-mode: screen;
    }

    .cup::after {
      top: 20px;
      left: 100%;
      width: 70px;
      height: 120px;
      border: 6px solid rgba(255, 255, 255, 0.35);
      border-left: none;
      border-radius: 0 60px 60px 0;
      transform: translateX(-20px);
      background: rgba(255, 255, 255, 0.08);
    }

    .fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, rgba(173, 90, 53, 0.8) 0%, var(--coffee-color) 80%);
      transition: height 0.4s ease;
    }

    .fill.milk-on {
      background: linear-gradient(180deg, var(--milk-color) 0%, rgba(199, 158, 119, 0.7) 30%, var(--coffee-color) 90%);
    }

    .foam {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--fill-height, 0%) + 10px);
      width: 80%;
      height: 26px;
      border-radius: 999px;
      background: rgba(255, 248, 240, 0.9);
      opacity: 0;
      transition: opacity 0.3s ease, bottom 0.4s ease;
      box-shadow: 0 6px 12px rgba(122, 75, 53, 0.15);
    }

    .foam.visible {
      opacity: 1;
    }

    .readout {
      text-align: center;
      font-size: 1rem;
      margin-top: 16px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="machine">
    <h1>Barra Retro Cafetera</h1>
    <section class="display" aria-live="polite">
      <div class="cup">
        <div id="coffeeFill" class="fill"></div>
        <div id="foam" class="foam"></div>
      </div>
    </section>

    <div class="controls">
      <label for="coffeeRange">Nivel de café</label>
      <input id="coffeeRange" type="range" min="0" max="100" value="0" />
      <div class="button-row">
        <button id="previewButton" type="button">Previsualizar</button>
        <button id="fillButton" type="button">Llenar Gradualmente</button>
        <button id="milkButton" type="button">Añadir Leche</button>
      </div>
    </div>

    <p id="readout" class="readout">Taza vacía.</p>
  </main>

  <script>
    const coffeeRange = document.getElementById('coffeeRange');
    const fill = document.getElementById('coffeeFill');
    const milkButton = document.getElementById('milkButton');
    const fillButton = document.getElementById('fillButton');
    const previewButton = document.getElementById('previewButton');
    const readout = document.getElementById('readout');
    const foam = document.getElementById('foam');

    let milkAdded = false;
    let animationFrame = null;

    function updateFillHeight(value) {
      const height = Math.max(0, Math.min(100, value));
      fill.style.height = `${height}%`;
      fill.style.setProperty('--fill-height', `${height}%`);
      foam.style.setProperty('--fill-height', `${height}%`);

      if (milkAdded && height > 10) {
        foam.classList.add('visible');
      } else {
        foam.classList.remove('visible');
      }

      if (height === 0) {
        readout.textContent = 'Taza vacía.';
      } else if (height < 35) {
        readout.textContent = 'Un sorbo de energía.';
      } else if (height < 70) {
        readout.textContent = 'Media taza lista.';
      } else if (height < 100) {
        readout.textContent = 'Casi al tope, ¡cuidado!';
      } else {
        readout.textContent = 'Taza llena al máximo.';
      }
    }

    function setMilkState(state) {
      milkAdded = state;
      milkButton.textContent = milkAdded ? 'Quitar Leche' : 'Añadir Leche';
      fill.classList.toggle('milk-on', milkAdded);

      if (milkAdded && parseFloat(coffeeRange.value) > 10) {
        foam.classList.add('visible');
      } else {
        foam.classList.remove('visible');
      }
    }

    function animateFillTo(target, duration = 2400, onComplete) {
      cancelAnimationFrame(animationFrame);
      const start = parseFloat(coffeeRange.value);
      const startTime = performance.now();

      function animateFill(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const value = start + (target - start) * eased;
        coffeeRange.value = value;
        updateFillHeight(value);

        if (progress < 1) {
          animationFrame = requestAnimationFrame(animateFill);
        } else {
          animationFrame = null;
          if (typeof onComplete === 'function') {
            onComplete();
          }
        }
      }

      animationFrame = requestAnimationFrame(animateFill);
    }

    coffeeRange.addEventListener('input', (event) => {
      cancelAnimationFrame(animationFrame);
      updateFillHeight(event.target.value);
    });

    milkButton.addEventListener('click', () => {
      setMilkState(!milkAdded);
    });

    fillButton.addEventListener('click', () => {
      animateFillTo(100);
    });

    previewButton.addEventListener('click', () => {
      cancelAnimationFrame(animationFrame);
      setMilkState(false);
      coffeeRange.value = 0;
      updateFillHeight(0);

      animateFillTo(70, 2000, () => {
        setTimeout(() => {
          setMilkState(true);
          animateFillTo(85, 900);
        }, 250);
      });
    });

    updateFillHeight(0);
  </script>
</body>
</html>
